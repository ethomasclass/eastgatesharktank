<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../css/fonts.css">
<body style="background:#2a180c;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px">
<script type="module">
for (const p of ['mercado','brewery','landing','residences','littleprague']) {
  const m = (await import(`../js/logos/${p}.js`)).default;
  document.body.insertAdjacentHTML('beforeend', `<div>${m.mark}</div><div style="width:120px">${m.icon}</div>`);
}
</script>

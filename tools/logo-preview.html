<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logo Preview</title>
  <link rel="stylesheet" href="../css/fonts.css">
  <style>
    body { margin: 0; background: #07090c; font-family: system-ui, sans-serif; color: #eee; }
    .row { display: flex; gap: 20px; padding: 16px; align-items: flex-end; flex-wrap: wrap; }
    .podium { width: 480px; height: 260px; background: linear-gradient(180deg, #5a3822, #2a180c); border: 6px solid #c9a54a; border-radius: 8px 8px 0 0;
      display: grid; place-items: center; padding: 14px; box-sizing: border-box; }
    .podium svg { width: 100%; height: 100%; }
    .light { width: 480px; height: 240px; background: #f4ead3; display: grid; place-items: center; }
    .light svg { width: 100%; height: 100%; }
    .icon { width: 120px; height: 120px; background: #0b2230; border-radius: 12px; padding: 8px; box-sizing: border-box; }
    .icon.small { width: 48px; height: 48px; padding: 4px; }
    .icon svg { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <!-- tools/logo-preview.html?pid=erie : the full logo on the podium (as on stage), on light paper, and the icon at two sizes -->
  <div class="row" id="row"></div>
  <script type="module">
    const pid = new URLSearchParams(location.search).get('pid') || 'turnpike';
    const L = (await import(`../js/logos/${pid}.js`)).default;
    document.getElementById('row').innerHTML =
      `<div class="podium" data-shot="podium">${L.mark}</div><div class="light" data-shot="light">${L.mark}</div>
       <div class="icon" data-shot="icon">${L.icon}</div><div class="icon small" data-shot="iconsmall">${L.icon}</div>`;
    document.body.dataset.ready = '1';
  </script>
</body>
</html>

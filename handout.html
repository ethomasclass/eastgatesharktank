<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>For Lease: Investor Tracker</title>
  <meta name="description" content="Printable investor tracker for For Lease: Vine & 18th. Neighborhood clues, a box for each pitch with Unit 3 connection questions, the Five Years Later math, and a thesis builder.">
  <link rel="stylesheet" href="css/fonts.css">
  <style>
    /* Black-and-white student handout: Archivo throughout, structure from rules and tabs. */
    :root { --ink: #111; --muted: #555; --label: #333; --line: #bdbdbd; --rule: #9a9a9a; --tint: #ececec; --tint-soft: #f5f5f5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #cfcfcf; color: var(--ink); font-family: 'Archivo', system-ui, sans-serif; font-size: 10pt; line-height: 1.3; }
    .page { width: 8.5in; height: 11in; margin: .3in auto; background: #fff; padding: .5in .55in; position: relative; overflow: hidden; display: flex; flex-direction: column; }
    .topbar { position: absolute; left: 0; right: 0; top: 0; height: .16in; background: var(--ink); }
    /* header (page 1) */
    .hdr { display: grid; grid-template-columns: auto 1fr auto; gap: 0 .16in; align-items: center; }
    .num { font-weight: 900; font-stretch: 85%; font-size: 30pt; line-height: 1; border: 3px solid var(--ink); padding: .02in .08in; }
    .kicker { font-weight: 800; font-size: 7.5pt; letter-spacing: .14em; text-transform: uppercase; color: var(--label); }
    h1 { margin: .02in 0 0; font-weight: 900; font-size: 25pt; line-height: 1; text-transform: uppercase; white-space: nowrap; }
    .doc-tab { display: inline-block; background: var(--ink); color: #fff; font-weight: 800; font-size: 7.5pt; letter-spacing: .14em; padding: .03in .09in; margin-top: .06in; }
    .credit { text-align: center; font-weight: 800; font-size: 6.5pt; letter-spacing: .12em; }
    .credit i { display: block; width: 46px; height: 46px; border: 2px solid var(--ink); margin: .03in auto 0; }
    .nameline { display: flex; gap: .2in; margin: .12in 0 .06in; font-weight: 700; font-size: 9.5pt; }
    .nameline span { flex: 1; border-bottom: 1px solid var(--ink); height: .24in; }
    .nameline span.s { flex: .35; }
    .dbl { border-top: 5px double var(--ink); margin-bottom: .1in; }
    /* running header (pages 2+) */
    .run { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--ink); padding-bottom: .05in; margin-bottom: .1in; }
    .run b { font-weight: 900; font-size: 11pt; }
    .run b span { border: 2px solid var(--ink); padding: 0 .05in; margin-right: .06in; }
    .run em { font-style: normal; font-weight: 800; font-size: 7.5pt; letter-spacing: .14em; text-transform: uppercase; }
    .directions { background: var(--tint); border: 2px solid var(--ink); padding: .08in .12in; font-size: 9.2pt; line-height: 1.38; margin-bottom: .1in; }
    .tab { display: inline-block; background: var(--ink); color: #fff; font-weight: 800; font-size: 7.5pt; letter-spacing: .12em; text-transform: uppercase; padding: .03in .09in; }
    /* neighborhood clues */
    .clues { border: 2.5px solid var(--ink); padding: .06in .12in .08in; margin-bottom: .12in; }
    .clues p { margin: .02in 0 .04in; font-size: 9pt; }
    .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: .02in .22in; }
    .cgrid div { font-weight: 800; font-size: 8pt; }
    .lines i { display: block; border-bottom: 1px solid var(--rule); height: .27in; }
    /* venture box */
    .venture { border: 2.5px solid var(--ink); margin-bottom: .1in; display: flex; flex-direction: column; }
    .v-head { display: flex; align-items: center; gap: .12in; padding: .04in .12in; border-bottom: 1.5px solid var(--ink); }
    .pitchno { width: .5in; height: .5in; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; text-align: center; font-weight: 800; font-size: 5.5pt; letter-spacing: .08em; line-height: 1.05; flex: none; }
    .pitchno b { display: block; width: .26in; height: .2in; background: #fff; border-radius: 2px; margin: .02in auto 0; }
    .v-name { flex: 1; }
    .v-name h2 { margin: 0; font-weight: 900; font-size: 15pt; line-height: 1.05; }
    .v-name div { font-size: 8.5pt; color: var(--muted); font-weight: 600; }
    .v-head img { width: .62in; height: .62in; object-fit: cover; border: 2px solid var(--ink); filter: grayscale(1); }
    .fields { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
    .fields div { padding: .05in .1in .03in; border-right: 1px solid var(--line); font-weight: 800; font-size: 6.8pt; letter-spacing: .12em; text-transform: uppercase; }
    .fields div:last-child { border-right: none; }
    .fields .lines i { height: .24in; }
    .row { padding: .04in .12in .02in; border-bottom: 1px solid var(--line); }
    .row .lines i { height: .25in; }
    .row > b { font-size: 9pt; }
    .connect { background: var(--tint-soft); padding: .04in .12in .03in; border-bottom: 1.5px solid var(--ink); }
    .connect .tab { margin-bottom: .03in; }
    .q { display: grid; grid-template-columns: .22in 1fr; gap: 0 .04in; margin-top: .03in; font-size: 9pt; line-height: 1.3; }
    .q > span { font-weight: 900; font-size: 10pt; }
    .q .lines i { height: .25in; }
    .money { display: grid; grid-template-columns: repeat(4, 1fr); gap: .12in; padding: .05in .12in; border-bottom: 1px solid var(--line); align-items: center; }
    .money div { display: flex; align-items: center; gap: .05in; font-weight: 700; font-size: 7.5pt; line-height: 1.05; }
    .money .l { width: .2in; height: .2in; border: 1.5px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 8pt; flex: none; }
    .money .box { flex: 1; border: 1.5px solid var(--ink); height: .28in; padding-left: .04in; display: flex; align-items: center; font-weight: 800; }
    .later { background: var(--tint); padding: .04in .12in .04in; }
    .later .tab { background: none; color: var(--ink); padding: 0; margin-right: .06in; }
    .later b { font-size: 9pt; }
    /* thesis page */
    .qbox { border: 2.5px solid var(--ink); padding: .08in .12in; font-size: 9.6pt; line-height: 1.4; margin-bottom: .1in; }
    .total { display: flex; align-items: center; gap: .14in; border: 2.5px solid var(--ink); padding: .07in .12in; margin-bottom: .12in; font-weight: 800; }
    .total span { flex: 1; font-weight: 600; color: var(--muted); font-size: 9pt; }
    .total .box { width: 1.5in; border: 2px solid var(--ink); height: .32in; display: flex; align-items: center; padding-left: .06in; }
    .sl { font-weight: 800; font-size: 7.5pt; letter-spacing: .14em; text-transform: uppercase; margin: .06in 0 .04in; }
    .choices { display: grid; grid-template-columns: repeat(5, 1fr); gap: .08in; margin-bottom: .1in; }
    .choices div { border: 1.5px solid var(--ink); padding: .05in; text-align: center; font-weight: 800; font-size: 8.3pt; line-height: 1.15; }
    .choices img { width: .62in; height: .62in; object-fit: cover; display: block; margin: 0 auto .04in; filter: grayscale(1); }
    .ev { display: grid; grid-template-columns: 1fr 1fr; gap: .14in; margin-bottom: .08in; }
    .ev > div { border: 1.5px solid var(--ink); padding: .05in .1in; }
    .ev small { display: block; font-style: italic; color: var(--muted); font-size: 8pt; }
    .thesis { border: 2.5px solid var(--ink); padding: .08in .14in; margin-top: .08in; }
    .thesis h3 { margin: 0; display: flex; justify-content: space-between; font-weight: 900; font-size: 12pt; }
    .thesis h3 span { font-weight: 800; font-size: 7.5pt; letter-spacing: .14em; text-transform: uppercase; align-self: center; }
    .eq { display: grid; grid-template-columns: .95in 1fr; align-items: end; gap: 0 .1in; margin-top: .02in; }
    .eq b { font-size: 10.5pt; padding-bottom: .03in; }
    .eq div { border-bottom: 1px solid var(--rule); height: .34in; position: relative; }
    .eq div small { position: absolute; top: .02in; left: 0; font-style: italic; font-size: 7pt; color: var(--muted); }
    .checks { display: flex; gap: .16in; margin-top: .08in; font-size: 8.4pt; font-weight: 700; }
    .checks span::before { content: ''; display: inline-block; width: .12in; height: .12in; border: 1.5px solid var(--ink); margin-right: .05in; vertical-align: -1px; }
    .frq { border: 2.5px solid var(--ink); padding: .07in .14in .06in; margin-top: .06in; }
    .frq-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .05in; }
    .frq-unit { font-weight: 800; font-size: 7pt; letter-spacing: .1em; text-transform: uppercase; color: var(--label); }
    .stim { background: var(--tint); border-left: 5px solid var(--ink); padding: .06in .1in; font-size: 9pt; line-height: 1.38; margin-bottom: .04in; }
    .fq { display: grid; grid-template-columns: .28in 1fr; gap: 0 .04in; margin-top: .05in; font-size: 9.6pt; }
    .fq > span { width: .22in; height: .22in; background: var(--ink); color: #fff; font-weight: 900; font-size: 9pt; display: grid; place-items: center; }
    .fq .lines i { height: .26in; }
    .foot { margin-top: auto; padding-top: .05in; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 7pt; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--label); }
    .tools { text-align: center; margin: 14px; font-family: system-ui; }
    .tools button { font: inherit; padding: 8px 18px; border-radius: 6px; border: 1px solid #555; background: #fff; cursor: pointer; }
    @media print {
      body { background: #fff; }
      .page { margin: 0; box-shadow: none; }
      .page + .page { break-before: page; }
      .tools { display: none; }
    }
    @page { size: letter; margin: 0; }
  </style>
</head>
<body>
  <div class="tools"><button onclick="print()">Print the tracker</button></div>
  <div id="pages"></div>

  <script>
    // Each venture gets its own box because the pitch order is shuffled every period:
    // students find the box when a pitch starts and write its number in the black circle.
    const V = [
      { id: 'mercado', name: 'Mercado Vine', who: 'Rosario Medina, owner of Panadería La Esperanza', qs: [
        'Rosario says landlords elsewhere "would not rent to us," but now "we stay because we want to." Did this <b>ethnic enclave</b> form by choice, by segregation, or both? Use her words.',
        'Name ONE thing an ethnic enclave gives the people who live there that you heard in this pitch.'] },
      { id: 'brewery', name: 'Eastgate Brewing', who: 'Cole Brennan, home brewer who grew up on 19th Street', qs: [
        '<b>Neolocalism</b> means a business builds its identity on a place\'s real history. Name TWO parts of Cole\'s plan that are neolocalism.',
        'Cole admits his $8 pints could raise prices. How might longtime residents react to new residents his taproom attracts?'] },
      { id: 'landing', name: 'The Landing', who: 'Maggie Alvarez-Novak, former ER nurse', qs: [
        'What evidence shows the block by the church is a <b>gendered space</b> today? Use a number from the briefing or the pitch.',
        'The hall was a women\'s sewing circle in 1921 and would be co-working space now. What does that change show about gender roles?'] },
      { id: 'residences', name: 'The Residences at Vine', who: 'Brent Hollis-Whitcomb, Hollis and Whitcomb Capital', qs: [
        '<b>Sequent occupancy</b> means each group leaves a layer on a place. What would Brent\'s plan do to the layers on this corner?',
        'A studio costs $2,400 a month and the typical income here is $41,000 a year. Who would live in these lofts, and how might neighbors react?'] },
      { id: 'littleprague', name: 'Little Prague Experience', who: 'Gerry Dvorak, suburban restaurateur', qs: [
        'Eastgate\'s <b>charter group</b> was Czech immigrants. Do they still live here? Give ONE clue from the briefing.',
        'Gerry wants to call the area "Little Prague." Neighbors call it the Barrio. Why does it matter whose name for a place gets used?'] },
    ];
    const lines = (n) => `<div class="lines">${'<i></i>'.repeat(n)}</div>`;
    const foot = (p) => `<div class="foot"><span>For Lease: Vine &amp; 18th | AP Human Geography Unit 3</span><span>Page ${p} of 4</span></div>`;
    const run = (right) => `<div class="topbar"></div><div class="run"><b><span>3.2</span>For Lease: Vine &amp; 18th</b><em>${right}</em></div>`;
    const venture = (v, n = 2) => `
      <section class="venture">
        <div class="v-head">
          <div class="pitchno">PITCH<b></b></div>
          <div class="v-name"><h2>${v.name}</h2><div>${v.who}</div></div>
          <img src="assets/img/heads/${v.id}.png" alt="">
        </div>
        <div class="row idea"><b>The idea.</b> What would this person do with the hall, and how would it make money?${lines(2)}</div>
        <div class="row"><b>Fits the neighborhood?</b> Name ONE briefing clue that backs this pitch up or warns against it.${lines(1)}</div>
        <div class="connect"><span class="tab">Unit 3 connection</span>
          ${v.qs.map((q, i) => `<div class="q"><span>${i + 1}</span><div>${q}${lines(n)}</div></div>`).join('')}
        </div>
        <div class="money">
          <div><span class="l">A</span>Left to<br>invest<span class="box">$</span></div>
          <div><span class="l">B</span>I invest<span class="box">$</span></div>
          <div><span class="l">C</span>Made<br>per $1<span class="box">$</span></div>
          <div><span class="l">D</span>Worth at end<br>= B × C<span class="box">$</span></div>
        </div>
        <div class="later"><span class="tab">Five years later</span><b>What would have happened to the block?</b>${lines(1)}</div>
      </section>`;

    const p1 = `<section class="page"><div class="topbar"></div>
      <div class="hdr" style="margin-top:.04in">
        <div class="num">3.2</div>
        <div><div class="kicker">Unit 3 · Topic 3.2 · Cultural Landscapes</div><h1>For Lease: Vine &amp; 18th</h1><span class="doc-tab">INVESTOR TRACKER</span></div>
        <div class="credit">TEACHER CREDIT<i></i></div>
      </div>
      <div class="nameline">Name <span></span> Date <span class="s"></span> Period <span class="s"></span></div>
      <div class="dbl"></div>
      <div class="directions"><b>You start with $1,000.</b> After each pitch, invest from $0 up to everything you have left. The choice is final, and you won't hear the next pitch first. Money you still have after the last pitch is worth nothing. You are not choosing who gets the lease: split your money across as many ideas as you like. <b>The pitches come in a random order:</b> when a pitch starts, find that person's box and write the pitch number in the black circle. Five Years Later shows each idea's possible future if it had opened in the hall. Fill in what happened and what your investment is worth. <b>Worth at end: D = B × C</b> (what you invested × what it made per $1).</div>
      <div class="clues"><span class="tab">Start here · Read the neighborhood</span>
        <p>While Dolores Vega gives the briefing, write ONE clue for each. You will use them to judge every pitch.</p>
        <div class="cgrid">
          <div>The building's layers (Czech, then Mexican)${lines(1)}</div><div>Who lives here now${lines(1)}</div>
          <div>The three names for this place${lines(1)}</div><div>Who feels safe where${lines(1)}</div>
        </div>
      </div>
      ${venture(V[0], 4)}
      ${foot(1)}</section>`;
    const p2 = `<section class="page">${run('Pitch boxes')}${venture(V[1])}${venture(V[2])}${foot(2)}</section>`;
    const p3 = `<section class="page">${run('Pitch boxes')}${venture(V[3])}${venture(V[4])}${foot(3)}</section>`;
    const p4 = `<section class="page">${run('Final tally · Free response')}
      <div class="total">My total worth at the end <span>Add D (worth at end) for all five pitches</span><div class="box">$</div></div>
      <div class="qbox"><b>Which venture would add the best new layer to Eastgate's cultural landscape?</b> Use what you learned in the game and in the 3.2 reading. The best layer fits the people who already live here and keeps the history that is still visible. It is not always the pitch with the best salesperson.</div>
      <div class="sl">1 · Circle your choice</div>
      <div class="choices">${V.map((v) => `<div><img src="assets/img/heads/${v.id}.png" alt="">${v.name}</div>`).join('')}</div>
      <div class="ev">
        <div><div class="sl" style="margin-top:0">2 · Evidence from the game</div><small>A clue from the briefing, a pitch, or Five Years Later</small>${lines(4)}</div>
        <div><div class="sl" style="margin-top:0">3 · Evidence from the reading</div><small>A Unit 3 term and what it means</small>${lines(4)}</div>
      </div>
      <div class="frq">
        <div class="frq-head"><span class="tab">4 · Free response</span><span class="frq-unit">Topic 3.2: Cultural Landscapes · use the AMSCO 3.2 reading and the game</span></div>
        <div class="stim"><b>Eastgate, Vine &amp; 18th.</b> Czech immigrants built Saint Wenceslas Church in 1893, and its cornerstone is still carved in Czech. By 2000, seven in ten homes in the neighborhood spoke Spanish. On the parish hall, a Spanish tortillería sign is painted over an older Czech beer ad. Longtime residents call the area "the Barrio." Some say they first came because landlords elsewhere would not rent to them; now they stay because they want to.</div>
        <div class="fq"><span>A</span><div><b>Define</b> sequent occupancy.${lines(2)}</div></div>
        <div class="fq"><span>B</span><div><b>Describe</b> ONE feature of Eastgate's cultural landscape that was left by its charter group.${lines(2)}</div></div>
        <div class="fq"><span>C</span><div><b>Describe</b> how ONE of the five pitches is an example of neolocalism.${lines(2)}</div></div>
        <div class="fq"><span>D</span><div><b>Explain</b> how Eastgate shows that an ethnic enclave can form through both choice and segregation.${lines(4)}</div></div>
      </div>
      ${foot(4)}</section>`;
    document.getElementById('pages').innerHTML = p1 + p2 + p3 + p4;
  </script>
</body>
</html>
